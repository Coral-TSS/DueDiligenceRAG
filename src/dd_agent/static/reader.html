<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料自动识别结果</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/reader.css"><script defer src="/static/progress.js"></script><script defer src="/static/reader.js"></script></head>
<body><header><div><span class="eyebrow">尽调报告 AGENT · 本地处理</span><h1>材料自动识别结果</h1><a href="/">返回材料工作区</a></div><button id="refresh-reading" class="secondary">刷新结果</button></header>
<main><section class="diagnostic" aria-label="处理进度"><div><strong id="reading-title">正在读取状态…</strong><p id="reading-progress" role="status" aria-live="polite"></p><p id="job-state" role="status" aria-live="polite"></p><button id="start-processing" disabled>自动处理该材料</button> <button id="pause-processing" class="secondary" hidden>暂停处理</button> <button id="resume-processing" hidden>继续处理</button></div></section>
<section id="stage-controls" class="card" aria-label="分别控制处理阶段" hidden></section>
<p class="notice">系统先提取文字，再按“公司基本情况与历史沿革”筛选扫描页，自动选取区域补识别。无法消解的信息标为未知，继续处理其他页面。页码从原文件第一页起算。</p>
<div class="page-nav"><label for="page-select">查看已处理页</label><select id="page-select" disabled></select><button id="page-more" class="secondary" hidden>加载更多页</button><label for="page-jump">跳转到</label><input id="page-jump" type="number" min="1" step="1" inputmode="numeric" placeholder="页码"><button id="page-jump-go" class="secondary">前往</button></div><p id="catalog-state" class="muted"></p><p id="reading-error" class="error" role="alert"></p>
<div class="reader-layout"><section class="card"><h2>原件页面预览</h2><p id="image-empty">该页尚无预览。</p><img id="page-image" hidden alt="原件页面预览"></section><section class="card"><h2>当前识别文字</h2><p id="page-state" class="muted"></p><p id="route-state"></p><pre id="effective-text"></pre><div id="machine-regions"></div></section></div>
<section class="card"><details id="raw-details"><summary>基础识别文字与行信息（展开后读取）</summary><pre id="page-text"></pre><div id="line-results"></div></details><details id="history-details"><summary>视觉增强历史（只读，按批查看）</summary><p id="history-counts"></p><div id="history-results"></div><button id="history-next" class="secondary" hidden>下一批历史</button></details></section></main></body></html>
