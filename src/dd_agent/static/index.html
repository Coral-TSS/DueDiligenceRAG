<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>尽调材料工作区</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>
</head>
<body class="workspace-page">
<header class="topbar">
  <div class="topbar-title">
    <h1>材料工作区</h1>
    <a id="search-link" href="/search">证据检索</a>
  </div>
  <span class="local">本机存储</span>
</header>
<main>
  <section class="diagnostic" aria-label="环境状态">
    <div>
      <strong id="health-title">正在检查工作区…</strong>
      <p id="health-message" role="status" aria-live="polite">检查数据库连接和初始化状态。</p>
    </div>
    <button id="retry" class="secondary">重新检查</button>
  </section>
  <div class="dataroom">
    <aside class="sidebar">
      <section class="project-block">
        <h2>项目</h2>
        <form id="project-form">
          <label for="project-name">新建项目</label>
          <div class="create-row">
            <input id="project-name" name="name" maxlength="200" placeholder="项目名称" required>
            <button id="create-project" type="submit">创建</button>
          </div>
          <p id="project-error" class="error" role="alert"></p>
        </form>
        <nav id="projects" aria-label="项目列表"></nav>
      </section>
      <section class="folder-pane">
        <h3>目录</h3>
        <nav id="folder-list" class="folder-list" aria-label="材料目录"></nav>
      </section>
    </aside>
    <section class="workspace" aria-labelledby="project-title">
      <div class="workspace-toolbar">
        <div>
          <h2 id="project-title">选择或创建一个项目</h2>
          <span id="document-count" class="muted"></span>
        </div>
        <details id="coverage-panel" class="coverage-disclosure">
          <summary>覆盖缺口</summary>
          <p id="coverage-summary" class="muted">先选择项目，再查看覆盖缺口。不按全库统计。</p>
          <p id="coverage-definition" class="muted"></p>
          <ul id="coverage-gaps"></ul>
          <button id="more-gaps" class="secondary" type="button" hidden>继续加载缺口</button>
          <p id="coverage-error" class="error" role="alert"></p>
        </details>
      </div>
      <form id="upload-form" class="upload-bar">
        <label for="files">导入材料</label>
        <div class="upload-box">
          <input id="files" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" aria-describedby="upload-help">
          <button id="upload" type="submit" disabled>导入所选文件</button>
        </div>
        <p id="upload-help" class="muted">导入会归入左侧当前目录。可多选 PDF、Word、Excel、PowerPoint 以及 JPG、JPEG、PNG；逐个导入，单个失败不会中断其他文件。导入后不会自动开始识别。</p>
      </form>
      <div class="process-bar">
        <div class="create-row">
          <button id="process-folder" type="button" disabled>处理本目录</button>
          <button id="process-all" type="button" class="secondary" disabled>处理全部已登记材料</button>
        </div>
        <p id="process-status" class="muted" role="status" aria-live="polite"></p>
      </div>
      <div id="upload-results" role="status" aria-live="polite"></div>
      <p id="list-error" class="error" role="alert"></p>
      <div id="editor-panel" hidden>
        <h3 id="editor-title">材料信息</h3>
        <div class="meta-grid">
          <label for="editor-category">所在目录<select id="editor-category"></select></label>
          <label for="editor-subject">所属主体<select id="editor-subject"></select></label>
          <label for="editor-date-kind">日期种类<select id="editor-date-kind"><option value="none">未填写</option><option value="point">时点</option><option value="period">期间</option></select></label>
          <label for="editor-point">时点<input id="editor-point" type="date"></label>
          <label for="editor-period-start">期间起<input id="editor-period-start" type="date"></label>
          <label for="editor-period-end">期间止<input id="editor-period-end" type="date"></label>
        </div>
        <div class="editor-subject-tools">
          <form id="subject-form" class="compact-create">
            <input id="subject-name" maxlength="200" placeholder="新主体名称" aria-label="新建主体名称">
            <select id="subject-role" aria-label="主体角色">
              <option value="other">其他</option>
              <option value="target">目标公司</option>
              <option value="subsidiary">子公司</option>
              <option value="shareholder">股东</option>
              <option value="counterparty">交易对手</option>
            </select>
            <button id="create-subject" type="submit">新建主体</button>
          </form>
          <button id="subject-rename-open" type="button" class="secondary" hidden>改名</button>
          <form id="subject-rename-form" class="compact-create" hidden>
            <input id="subject-rename-id" type="hidden">
            <input id="subject-rename-name" maxlength="200" aria-label="修改主体名称">
            <button id="subject-rename-save" type="submit">保存名称</button>
          </form>
          <p id="subject-error" class="error" role="alert"></p>
        </div>
        <div class="create-row">
          <button id="editor-save" type="button">保存材料信息</button>
          <button id="editor-cancel" type="button" class="secondary">取消</button>
        </div>
        <p id="editor-error" class="error" role="alert"></p>
      </div>
      <div id="empty" class="empty">先创建项目，再将收集到的材料导入这里。</div>
      <div class="table-scroll">
        <table id="documents-table" hidden>
          <thead>
            <tr>
              <th>原始文件名</th>
              <th>目录</th>
              <th>状态</th>
              <th>大小</th>
              <th>登记时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="documents"></tbody>
        </table>
      </div>
      <button id="more-materials" class="secondary" hidden>加载更多材料</button>
    </section>
  </div>
  <footer>材料与处理结果保存在本机，当前不调用云端模型。</footer>
</main>
</body>
</html>
